  </text>

  <!-- Hard -->
  <text x="20"
        y="195"
        fill="#c0c0c0"
        font-family="Courier New, monospace"
        font-size="13px">
    Hard
  </text>

  <text x="75"
        y="195"
        fill="#9b59b6"
        font-family="Courier New, monospace"
        font-size="13px">
    [
  </text>

  <rect x="85"
        y="182"
        width="350"
        height="14"
        rx="2"
        fill="#1a1a2e"/>

  <rect x="85"
        y="182"
        width="35"
        height="14"
        rx="2"
