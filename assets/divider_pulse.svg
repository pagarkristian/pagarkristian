<svg xmlns="http://www.w3.org/2000/svg" width="700" height="30" viewBox="0 0 700 30">
  <defs>
    <filter id="glow-line">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="20%" style="stop-color:#9b59b6"/>
      <stop offset="80%" style="stop-color:#9b59b6"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="700" height="30" fill="#0d1117"/>

  <!-- Base line -->
  <line x1="0" y1="15" x2="700" y2="15" stroke="url(#fade)" stroke-width="1" opacity="0.3"/>

  <!-- EKG pulse path -->
  <polyline
    points="0,15 120,15 140,15 150,4 160,26 170,4 180,15 200,15 700,15"
    fill="none"
    stroke="#9b59b6"
    stroke-width="2"
    filter="url(#glow-line)"
    stroke-dasharray="700"
    stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="-700" dur="2.5s" repeatCount="indefinite"/>
  </polyline>

  <!-- Traveling glow dot -->
  <circle r="3" fill="#c39bd3" filter="url(#glow-line)">
    <animateMotion dur="2.5s" repeatCount="indefinite"
      path="M0,15 L120,15 L140,15 L150,4 L160,26 L170,4 L180,15 L200,15 L700,15"/>
  </circle>
</svg>