<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280">
  <defs>
    <style>
      .terminal-bg { fill: #0d1117; rx: 8; }
      .title-bar { fill: #1a1a2e; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #febc2e; }
      .dot-green { fill: #28c840; }
      .prompt { fill: #9b59b6; font-family: "Courier New", monospace; font-size: 13px; font-weight: bold; }
      .cmd { fill: #ffffff; font-family: "Courier New", monospace; font-size: 13px; }
      .key { fill: #9b59b6; font-family: "Courier New", monospace; font-size: 13px; font-weight: bold; }
      .val { fill: #c0c0c0; font-family: "Courier New", monospace; font-size: 13px; }
      .status-ok { fill: #50fa7b; font-family: "Courier New", monospace; font-size: 13px; font-weight: bold; }
      .bracket { fill: #9b59b6; font-family: "Courier New", monospace; font-size: 13px; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="280" rx="10" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="700" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="700" height="10" fill="#161b22"/>

  <!-- Window dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>

  <!-- Title -->
  <text x="350" y="23" text-anchor="middle" fill="#9b59b6" font-family="Courier New, monospace" font-size="13px" font-weight="bold" filter="url(#glow)">starligon2@htb — ~/profile</text>

  <!-- Line 1: prompt -->
  <text x="16" y="65" class="prompt">┌──(starligon2㉿htb)-[~/profile]</text>
  <text x="16" y="83" class="prompt">└─$ </text>
  <text x="52" y="83" class="cmd">cat about.txt</text>

  <!-- Line 3: Name -->
  <text x="32" y="108" class="key">Name</text>
  <text x="90" y="108" class="val">: Pagar Kristian</text>

  <!-- Line 4: Role -->
  <text x="32" y="128" class="key">Role</text>
  <text x="90" y="128" class="val">: SMK Student, Grade 12 — Cybersecurity Track</text>

  <!-- Line 5: Focus -->
  <text x="32" y="148" class="key">Focus</text>
  <text x="90" y="148" class="val">: Penetration Testing · Web Security · Linux</text>

  <!-- Line 6: HTB -->
  <text x="32" y="168" class="key">HTB</text>
  <text x="90" y="168" class="val">: starligon2  |  12 machines pwned (1 Hard, 4 Medium, 7 Easy)</text>

  <!-- Line 7: Learning -->
  <text x="32" y="188" class="key">Learning</text>
  <text x="110" y="188" class="val">: CPTS Path — HTB Academy (Penetration Tester Job Role)</text>

  <!-- Line 8: Goal -->
  <text x="32" y="208" class="key">Goal</text>
  <text x="90" y="208" class="val">: Break things ethically. Document everything.</text>

  <!-- Line 9: Status -->
  <text x="32" y="228" class="key">Status</text>
  <text x="100" y="228" class="bracket">: [</text>
  <text x="118" y="228" class="status-ok"> LEARNING </text>
  <text x="196" y="228" class="bracket">]</text>
  <text x="208" y="228" class="val"> — actively grinding</text>

  <!-- Cursor blink -->
  <rect x="16" y="248" width="8" height="16" fill="#9b59b6" opacity="0.9">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
