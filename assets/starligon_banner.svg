<svg xmlns="http://www.w3.org/2000/svg" width="700" height="140" viewBox="0 0 700 140">
  <defs>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3483"/>
      <stop offset="50%" style="stop-color:#d2b4de"/>
      <stop offset="100%" style="stop-color:#6c3483"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="140" rx="8" fill="#0d1117"/>

  <!-- Border lines -->
  <line x1="50" y1="8" x2="650" y2="8" stroke="#9b59b6" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="132" x2="650" y2="132" stroke="#9b59b6" stroke-width="1" opacity="0.4"/>

  <!-- Corner markers -->
  <text x="18" y="18" fill="#9b59b6" font-family="Courier New, monospace" font-size="11px" opacity="0.5">/*</text>
  <text x="662" y="18" fill="#9b59b6" font-family="Courier New, monospace" font-size="11px" opacity="0.5">*/</text>
  <text x="18" y="132" fill="#9b59b6" font-family="Courier New, monospace" font-size="11px" opacity="0.5">/*</text>
  <text x="662" y="132" fill="#9b59b6" font-family="Courier New, monospace" font-size="11px" opacity="0.5">*/</text>

  <!-- STARLIGON — single text, gradient fill + glow filter -->
  <text x="350" y="62" text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="42px"
    font-weight="bold"
    letter-spacing="10"
    fill="url(#text-grad)"
    filter="url(#glow-strong)">STARLIGON</text>

  <!-- Subtitle -->
  <text x="350" y="88" text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="11px"
    fill="#9b59b6"
    filter="url(#glow-soft)"
    letter-spacing="4">— pagarkristian —</text>

  <!-- Slogan -->
  <text x="350" y="114" text-anchor="middle"
    font-family="Courier New, monospace"
    font-size="12px"
    fill="#555555"
    letter-spacing="1"
    font-style="italic">Unleash The Fool. Build The Legacy.</text>

  <!-- Subtle breathing glow overlay -->
  <rect width="700" height="140" rx="8" fill="#9b59b6" opacity="0">
    <animate attributeName="opacity" values="0;0.03;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
