<svg xmlns="http://www.w3.org/2000/svg" width="700" height="170" viewBox="0 0 700 170">
  <defs>

    <!-- Text Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Progress Glow -->
    <filter id="bar-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient -->
    <linearGradient id="progress-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b76ae3"/>
      <stop offset="40%" style="stop-color:#8f87da"/>
      <stop offset="70%" style="stop-color:#49b8c7"/>
      <stop offset="100%" style="stop-color:#19d1b3"/>
    </linearGradient>

  </defs>

  <!-- Background -->
  <rect width="700" height="170" rx="10" fill="#0d1117"/>

  <!-- Title Bar -->
  <rect width="700" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="700" height="10" fill="#161b22"/>

  <!-- Window Buttons -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>

  <!-- Title -->
  <text
    x="350"
    y="23"
    text-anchor="middle"
    fill="#9b59b6"
    font-family="Courier New, monospace"
    font-size="13px"
    font-weight="bold">
    currently_learning.sh
  </text>

  <!-- Active Path -->
  <text x="20" y="68"
        fill="#50fa7b"
        font-family="Courier New, monospace"
        font-size="13px"
        font-weight="bold">
    [*]
  </text>

  <text x="52" y="68"
        fill="#c0c0c0"
        font-family="Courier New, monospace"
        font-size="13px">
    Active Path :
  </text>

  <text x="175" y="68"
        fill="#9b59b6"
        font-family="Courier New, monospace"
        font-size="13px"
        font-weight="bold"
        filter="url(#glow)">
    CPTS — Penetration Tester Job Role Path
  </text>

  <!-- Platform -->
  <text x="20" y="90"
        fill="#50fa7b"
        font-family="Courier New, monospace"
        font-size="13px"
        font-weight="bold">
    [*]
  </text>

  <text x="52" y="90"
        fill="#c0c0c0"
        font-family="Courier New, monospace"
        font-size="13px">
    Platform     : HTB Academy
  </text>

  <!-- Mode -->
  <text x="20" y="112"
        fill="#50fa7b"
        font-family="Courier New, monospace"
        font-size="13px"
        font-weight="bold">
    [*]
  </text>

  <text x="52" y="112"
        fill="#c0c0c0"
        font-family="Courier New, monospace"
        font-size="13px">
    Mode         : Self-study, no cert — pure knowledge
  </text>

  <!-- Progress Label -->
  <text x="20"
        y="138"
        fill="#c0c0c0"
        font-family="Courier New, monospace"
        font-size="12px">
    Progress
  </text>

  <!-- Progress Background -->
  <rect x="90"
        y="126"
        width="570"
        height="12"
        rx="3"
        fill="#171b2f"/>

  <!-- Progress Fill -->
  <rect x="90"
        y="126"
        width="74"
        height="12"
        rx="3"
        fill="url(#progress-grad)"
        filter="url(#bar-glow)">
    <animate
      attributeName="width"
      from="0"
      to="74"
      dur="1.5s"
      fill="freeze"/>
  </rect>

  <!-- Percentage -->
  <text x="175"
        y="137"
        fill="#ffffff"
        font-family="Courier New, monospace"
        font-size="10px"
        font-weight="bold">
    13%
  </text>

</svg>
